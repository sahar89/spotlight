  .revealed {
    opacity: var(--spot-opacity);
    -webkit-mask-image: radial-gradient(circle calc(var(--spot-size) / 2) at var(--spot-x) var(--spot-y), #000 0%, #000 51%, rgba(0,0,0,.94) 61%, rgba(0,0,0,.66) 73%, rgba(0,0,0,.24) 88%, transparent 100%);
    mask-image: radial-gradient(circle calc(var(--spot-size) / 2) at var(--spot-x) var(--spot-y), #000 0%, #000 51%, rgba(0,0,0,.94) 61%, rgba(0,0,0,.66) 73%, rgba(0,0,0,.24) 88%, transparent 100%);

  .dither { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  .stage.dithered .art { visibility: hidden; }
  .stage:focus-visible { outline: 2px solid #e9d6a9; outline-offset: -5px; }
  .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); pointer-events: none; font: 11px/1.4 system-ui,sans-serif; text-transform: uppercase; letter-spacing: .2em; color: #9b8b73; opacity: .7; transition: opacity .4s; white-space: nowrap; }
  .hint.hidden { opacity: 0; }
  @media (pointer: coarse) { .stage { cursor: auto; } .hint { bottom: 35px; } }

<body>
<main class="stage" id="stage" tabindex="0" aria-label="Interactive artwork: move the pointer or drag a finger to reveal the image">
  <div class="art revealed" id="art" aria-hidden="true"></div>
</main>
<div class="hint" id="hint">Move to illuminate</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(() => {
  const stage = document.querySelector('#stage');
  const art = document.querySelector('#art');
  const hint = document.querySelector('#hint');
  const settings = { diameter: 360, followDuration: 0.48, fadeDuration: 0.32 };
  const point = { x: innerWidth / 2, y: innerHeight / 2 };
  let active = false;
  let fallbackRaf = 0;
  function draw() {
    art.style.setProperty('--spot-x', `${point.x}px`);
    art.style.setProperty('--spot-y', `${point.y}px`);
  }
  function animatePoint(x, y) {
    if (window.gsap) gsap.to(point, { x, y, duration: settings.followDuration, ease: 'power3.out', overwrite: true, onUpdate: draw });
    else { point.x = x; point.y = y; draw(); }
  }
  function fade(opacity) {
    if (window.gsap) gsap.to(art, { '--spot-opacity': opacity, duration: settings.fadeDuration, ease: 'power2.out', overwrite: 'auto' });
    else art.style.setProperty('--spot-opacity', opacity);
  }
  function reveal(e) {
    animatePoint(e.clientX, e.clientY);
    if (!active) { active = true; fade(1); hint.classList.add('hidden'); }
  }
  stage.addEventListener('pointerenter', reveal);
  stage.addEventListener('pointermove', reveal);
  stage.addEventListener('pointerdown', e => { stage.setPointerCapture?.(e.pointerId); reveal(e); });
  stage.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') { active = false; fade(0); } });
  stage.addEventListener('pointerup', e => { if (e.pointerType === 'touch') { active = false; fade(0); } });
  stage.addEventListener('pointercancel', () => { active = false; fade(0); });
  window.addEventListener('blur', () => { active = false; fade(0); });
  stage.addEventListener('keydown', e => {
    const step = 35;
    const changes = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (changes[e.key]) { e.preventDefault(); const [dx,dy] = changes[e.key]; animatePoint(Math.max(0,Math.min(innerWidth,point.x+dx)),Math.max(0,Math.min(innerHeight,point.y+dy))); active = true; fade(1); hint.classList.add('hidden'); }
    if (e.key === 'Escape') { active = false; fade(0); }
  });
  function resize() { document.documentElement.style.setProperty('--spot-size', `${Math.min(settings.diameter, Math.max(200, innerWidth * .7))}px`); draw(); }
  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// Dithering post-process: re-renders the spotlit artwork in WebGL at 1/3 resolution,
// then applies Bayer 8x8 ordered dithering to a palette sampled from bg.jpg.
// Reads the same CSS variables the spotlight writes, so interaction is untouched.
(() => {
  const PIXEL = 3;
  const IMAGE_COLORS = 5;
  const STAGE_BG = [5, 4, 3];
  const ART_BG = [104, 80, 56];
  const MASK_STOPS = [[0, 1], [.51, 1], [.61, .94], [.73, .66], [.88, .24], [1, 0]];

  const stage = document.querySelector('#stage');
  const art = document.querySelector('#art');
  const canvas = document.createElement('canvas');
  canvas.className = 'dither';
  canvas.setAttribute('aria-hidden', 'true');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  if (!gl) return;

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { try { init(); } catch (err) { console.warn('Dither disabled:', err); } };
  img.src = getComputedStyle(art).backgroundImage.slice(4, -1).replace(/["']/g, '');

  // Small deterministic k-means over a downsampled copy of the image.
  function samplePalette(k) {
    const size = 64;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;
    const px = [];
    for (let i = 0; i < data.length; i += 4) px.push([data[i], data[i + 1], data[i + 2]]);
    const lum = p => p[0] * .299 + p[1] * .587 + p[2] * .114;
    const sorted = [...px].sort((a, b) => lum(a) - lum(b));
    let centers = Array.from({ length: k }, (_, i) => sorted[Math.floor((i + .5) / k * sorted.length)].slice());
    for (let iter = 0; iter < 12; iter++) {
      const sums = centers.map(() => [0, 0, 0, 0]);
      for (const p of px) {
        let best = 0, bestD = Infinity;
        centers.forEach((c, i) => { const d = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2; if (d < bestD) { bestD = d; best = i; } });
        const s = sums[best]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
      }
      centers = sums.map((s, i) => s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3]] : centers[i]);
    }
    return centers;
  }

  function init() {
    const palette = [...samplePalette(IMAGE_COLORS), ART_BG, STAGE_BG];
    const N = palette.length;

    const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
    const fs = `
      precision highp float;
      uniform sampler2D uImg, uBayer;
      uniform vec2 uRes, uView, uImgSize, uSpot;
      uniform float uPixel, uRadius, uOpacity;
      uniform vec3 uPal[${N}];
      uniform float uStops[${MASK_STOPS.length * 2}];
      const vec3 STAGE_BG = vec3(${STAGE_BG.map(v => (v / 255).toFixed(4)).join(',')});
      const vec3 ART_BG = vec3(${ART_BG.map(v => (v / 255).toFixed(4)).join(',')});

      float mask(float d) {
        float t = d / uRadius;
        float v = 0.;
        for (int i = 0; i < ${MASK_STOPS.length - 1}; i++) {
          float t0 = uStops[i * 2], a0 = uStops[i * 2 + 1], t1 = uStops[i * 2 + 2], a1 = uStops[i * 2 + 3];
          if (t >= t0 && t <= t1) v = mix(a0, a1, (t - t0) / (t1 - t0));
        }
        return v;
      }

      vec3 artAt(vec2 p) {
        float s = min(uView.x / uImgSize.x, uView.y / uImgSize.y);
        vec2 size = uImgSize * s;
        vec2 uv = (p - (uView - size) * .5) / size;
        if (any(lessThan(uv, vec2(0.))) || any(greaterThan(uv, vec2(1.)))) return ART_BG;
        return texture2D(uImg, uv).rgb;
      }

      void main() {
        vec2 cell = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
        vec2 p = cell * uPixel;
        float o = uPixel * .25;
        vec3 col = (artAt(p + vec2(-o, -o)) + artAt(p + vec2(o, -o)) + artAt(p + vec2(-o, o)) + artAt(p + vec2(o, o))) * .25;
        col = mix(STAGE_BG, col, mask(distance(p, uSpot)) * uOpacity);

        // Two nearest palette colours, then Bayer threshold along the segment between them.
        vec3 c1 = uPal[0], c2 = uPal[0];
        float d1 = 1e9, d2 = 1e9;
        for (int i = 0; i < ${N}; i++) {
          vec3 diff = col - uPal[i];
          float d = dot(diff, diff);
          if (d < d1) { d2 = d1; c2 = c1; d1 = d; c1 = uPal[i]; }
          else if (d < d2) { d2 = d; c2 = uPal[i]; }
        }
        vec3 seg = c2 - c1;
        float t = clamp(dot(col - c1, seg) / max(dot(seg, seg), 1e-6), 0., 1.);
        float threshold = texture2D(uBayer, gl_FragCoord.xy / 8.).r;
        gl_FragColor = vec4(t > threshold ? c2 : c1, 1.);
      }`;

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

    function texture(unit, filter, wrap) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      return t;
    }
    texture(0, gl.LINEAR, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);

    texture(1, gl.NEAREST, gl.REPEAT);
    const bayer = new Uint8Array(64);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      let v = 0;
      for (let bit = 0; bit < 3; bit++) v = (v << 2) | ((((x ^ y) >> bit) & 1) << 1) | ((y >> bit) & 1);
      bayer[(7 - y) * 8 + x] = Math.round((v + .5) / 64 * 255);
    }
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 8, 8, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, bayer);

    const u = name => gl.getUniformLocation(prog, name);
    gl.uniform1i(u('uImg'), 0);
    gl.uniform1i(u('uBayer'), 1);
    gl.uniform2f(u('uImgSize'), img.naturalWidth, img.naturalHeight);
    gl.uniform1f(u('uPixel'), PIXEL);
    gl.uniform3fv(u('uPal'), palette.flatMap(c => c.map(v => v / 255)));
    gl.uniform1fv(u('uStops'), MASK_STOPS.flat());
    const uRes = u('uRes'), uView = u('uView'), uSpot = u('uSpot'), uRadius = u('uRadius'), uOpacity = u('uOpacity');

    function resize() {
      canvas.width = Math.ceil(innerWidth / PIXEL);
      canvas.height = Math.ceil(innerHeight / PIXEL);
      canvas.style.width = `${canvas.width * PIXEL}px`;
      canvas.style.height = `${canvas.height * PIXEL}px`;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
    addEventListener('resize', resize);
    resize();

    let lastKey = '';
    function frame() {
      const cs = getComputedStyle(art);
      const x = parseFloat(cs.getPropertyValue('--spot-x')) || 0;
      const y = parseFloat(cs.getPropertyValue('--spot-y')) || 0;
      const size = parseFloat(cs.getPropertyValue('--spot-size')) || 0;
      const opacity = parseFloat(cs.getPropertyValue('--spot-opacity')) || 0;
      const w = art.clientWidth, h = art.clientHeight;
      const key = [x, y, size, opacity, w, h, canvas.width, canvas.height].join();
      if (key !== lastKey) {
        lastKey = key;
        gl.uniform2f(uView, w, h);
        gl.uniform2f(uSpot, x, y);
        gl.uniform1f(uRadius, size / 2);
        gl.uniform1f(uOpacity, opacity);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      requestAnimationFrame(frame);
    }

    art.after(canvas);
    stage.classList.add('dithered');
    frame();
  }
})();
</script>
</body>
</html>
